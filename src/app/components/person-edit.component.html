<h2>Edit Person</h2>
<form (ngSubmit)="save()">
  <label>
    Name:
    <input [(ngModel)]="person.name" name="name" required />
  </label><br />
  <label>
    Age:
    <input type="number" [(ngModel)]="person.age" name="age" required />
  </label><br />
  <button type="submit">Save</button>
</form>
